<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Launcher</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><span>▲</span> Launcher</div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/about">About</a>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div style="padding:28px 28px 10px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--mauve);margin-bottom:4px">▲ Launcher</div>
        <p style="color:var(--muted);font-size:13px">Sign in to access the Developer Dashboard</p>
      </div>

      <div class="tabs" style="margin:16px 28px 0;border-bottom:1px solid var(--border)">
        <button class="tab active" onclick="showForm('login')" id="tab-login">Sign In</button>
        <button class="tab" onclick="showForm('signup')" id="tab-signup">Create Account</button>
      </div>

      <div style="padding:24px 28px 28px">
        <div id="alert" style="display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f87171;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px"></div>

        <!-- Login form -->
        <form id="form-login" onsubmit="return handleAuth(event,'login')">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-user" placeholder="e.g. srinibas" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
        </form>

        <!-- Signup form -->
        <form id="form-signup" style="display:none" onsubmit="return handleAuth(event,'signup')">
          <div class="form-group">
            <label>Username (min 3 characters)</label>
            <input type="text" id="signup-user" placeholder="Choose a username" required>
          </div>
          <div class="form-group">
            <label>Password (min 6 characters, hashed with scrypt)</label>
            <input type="password" id="signup-pass" placeholder="Choose a password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
        </form>

        <p style="color:var(--muted);font-size:12px;text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
          🔒 Default: <code style="color:var(--accent)">srinibas</code> / <code style="color:var(--accent)">password123</code>
        </p>
      </div>
    </div>
  </div>

  <script>
    function showForm(mode) {
      document.getElementById('form-login').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('form-signup').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('alert').style.display = 'none';
    }

    async function handleAuth(e, action) {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.style.display = 'none';

      const user = document.getElementById(action + '-user').value.trim();
      const pass = document.getElementById(action + '-pass').value;

      const res = await fetch('/api/auth?action=' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      });

      const data = await res.json();
      if (!res.ok) {
        alert.textContent = data.error || 'Authentication failed';
        alert.style.display = 'block';
        return false;
      }
      window.location.href = '/dashboard';
      return false;
    }
  </script>
</body>
</html>
